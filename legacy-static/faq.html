<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAQ — BF Suma with Team Vitality</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/logo.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body data-active="faq">
<div style="min-height:100vh;display:flex;flex-direction:column">
  <div id="site-header"></div>

  <section style="background:var(--surface-subtle);border-bottom:1px solid var(--slate-100)">
    <div class="bf-container" style="padding-top:clamp(36px,5vw,56px);padding-bottom:clamp(36px,5vw,56px)">
      <p class="eyebrow" style="margin-bottom:10px">FAQ</p>
      <h1 style="margin:0;max-width:640px;font-size:clamp(1.75rem,4vw,2.5rem);font-weight:700;line-height:1.1;color:var(--slate-900)">Common questions</h1>
      <p style="margin:14px 0 0;max-width:560px;font-size:1rem;line-height:1.6;color:var(--slate-600)">Everything you might want to know before booking a training session.</p>
    </div>
  </section>

  <section style="padding:48px 0 64px">
    <div class="bf-container" style="max-width:820px">
      <div id="faq-list" style="display:flex;flex-direction:column;gap:10px"></div>
      <div style="margin-top:32px;background:var(--surface);border:1px solid rgba(226,232,240,.9);border-radius:16px;box-shadow:var(--shadow-soft);padding:clamp(24px,4vw,32px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px">
        <div>
          <h2 style="margin:0;font-size:1.125rem;font-weight:700;color:var(--slate-900)">Still have a question?</h2>
          <p style="margin:6px 0 0;font-size:.875rem;line-height:1.55;color:var(--slate-600)">Message Sarah Nakato directly — we're happy to help.</p>
        </div>
        <a class="btn btn-brand btn-md" id="wa-btn" href="#" target="_blank" rel="noopener"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path></svg>Chat with us</a>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>
</div>

<script type="module">
import { FAQS, waLink } from './app.js';
document.getElementById('wa-btn').href = waLink();
let open = 0;
const list = document.getElementById('faq-list');
function render(){
  list.innerHTML = FAQS.map((f,i)=>`
    <div style="background:var(--surface);border:1px solid rgba(226,232,240,.9);border-radius:12px;box-shadow:var(--shadow-soft);overflow:hidden">
      <button type="button" data-i="${i}" aria-expanded="${open===i}" style="width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;border:none;background:transparent;cursor:pointer;padding:16px 18px;font-family:inherit;text-align:left">
        <span style="font-size:.9375rem;font-weight:600;color:var(--slate-900)">${f.q}</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--slate-500)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transition:transform 200ms ease;transform:${open===i?'rotate(180deg)':'none'};flex-shrink:0"><path d="m6 9 6 6 6-6"></path></svg>
      </button>
      ${open===i?`<p style="margin:0;padding:0 18px 16px;font-size:.875rem;line-height:1.6;color:var(--slate-600)">${f.a}</p>`:''}
    </div>`).join('');
  list.querySelectorAll('button[data-i]').forEach(b=>b.addEventListener('click',()=>{
    const i=+b.dataset.i; open = open===i ? -1 : i; render();
  }));
}
render();
</script>
</body>
</html>
