<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Member Dashboard — BF Suma with Team Vitality</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/logo.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body data-active="dashboard">
<div style="min-height:100vh;display:flex;flex-direction:column" id="root"></div>

<script type="module">
import { supabase, BRAND, renderDashHeader, getMember, getWeeklyReferrals, getReferrals, getLeaderboard, getDashStats, initials, esc } from './app.js';
const root=document.getElementById('root');
const AUTH='bfsuma-demo-auth';
const isAuthed=()=>{ try{ return localStorage.getItem(AUTH)==='1'; }catch(e){ return false; } };

function renderLogin(err){
  root.innerHTML=`
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px">
    <a href="index.html" style="display:flex;margin-bottom:28px"><img src="assets/logo.svg" alt="BF Suma" style="height:40px"></a>
    <div style="width:100%;max-width:400px;background:var(--surface);border:1px solid rgba(226,232,240,.9);border-radius:16px;box-shadow:var(--shadow-card);padding:clamp(24px,5vw,32px)">
      <h1 style="margin:0;font-size:1.375rem;font-weight:700;color:var(--slate-900)">Member login</h1>
      <p style="margin:8px 0 22px;font-size:.875rem;line-height:1.6;color:var(--slate-600)">Sign in to track your weekly referrals and team progress.</p>
      <div style="display:flex;flex-direction:column;gap:16px">
        <div style="display:flex;flex-direction:column;gap:6px">
          <label for="login-email" style="font-size:.8125rem;font-weight:600;color:var(--slate-700)">Email</label>
          <input id="login-email" type="email" class="bf-input ${err?'invalid':''}" placeholder="you@example.com">
        </div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <label for="login-password" style="font-size:.8125rem;font-weight:600;color:var(--slate-700)">Password</label>
          <input id="login-password" type="password" class="bf-input ${err?'invalid':''}" placeholder="••••••••">
          ${err?'<span role="alert" style="font-size:.75rem;color:var(--status-danger)">Enter your email and password to continue</span>':''}
        </div>
        <button id="login-btn" class="btn btn-primary btn-lg btn-full" type="button">Sign In</button>
      </div>
      <p style="margin:16px 0 0;font-size:.75rem;line-height:1.5;color:var(--slate-400);text-align:center">Demo build — any email and password will sign you in.</p>
    </div>
    <a href="index.html" style="margin-top:20px;font-size:.8125rem;color:var(--slate-500)">← Back to public site</a>
  </div>`;
  document.getElementById('login-btn').addEventListener('click',()=>{
    const em=document.getElementById('login-email').value.trim();
    const pw=document.getElementById('login-password').value;
    if(!em||!pw){ renderLogin(true); return; }
    try{ localStorage.setItem(AUTH,'1'); }catch(e){}
    renderDash();
  });
}

function icon(paths){ return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${paths.map(d=>`<path d="${d}"></path>`).join('')}</svg>`; }
function statsCard(label,value,trend,ic,tint){
  return `<div class="stats-card"><div class="sc-top"><span class="sc-label">${label}</span><span class="sc-icon ${tint}">${ic}</span></div><span class="sc-value">${value}</span>${trend?`<span class="sc-trend">${trend}</span>`:''}</div>`;
}

async function renderDash(){
  root.innerHTML=`<div id="dash-hd"></div><main class="bf-container" style="padding-top:40px;padding-bottom:48px"><p style="color:var(--slate-400);font-size:.875rem">Loading your dashboard…</p></main>`;
  const [member,weekly,referrals,leaderboard,stats]=await Promise.all([getMember(),getWeeklyReferrals(),getReferrals(),getLeaderboard(),getDashStats()]);
  const ini=initials(member.name);
  document.getElementById('dash-hd').innerHTML=renderDashHeader('overview',ini);
  document.getElementById('logout-btn')?.addEventListener('click',()=>{ try{ localStorage.setItem(AUTH,'0'); }catch(e){} renderLogin(false); });

  const hour=new Date().getHours();
  const greeting=hour<12?'Good morning':hour<17?'Good afternoon':'Good evening';
  const goalDone=stats.referralsThisWeek, goalTarget=member.weekly_goal;
  const pct=Math.min(1,goalDone/goalTarget); const circ=2*Math.PI*64;
  const maxCount=Math.max(1,...weekly.map(w=>w.count));
  const now=new Date();
  const monday=new Date(now); monday.setDate(now.getDate()-((now.getDay()+6)%7));
  const sunday=new Date(monday); sunday.setDate(monday.getDate()+6);
  const fmt=d=>d.toLocaleDateString('en-UG',{month:'short',day:'numeric'});
  const goalMsg=goalDone>=goalTarget?'Goal reached — brilliant week!':((goalTarget-goalDone)+' more '+((goalTarget-goalDone===1)?'referral':'referrals')+" to hit this week's goal");

  const bars=weekly.map((w,i)=>{
    const current=i===weekly.length-1;
    const h=Math.max(8,Math.round((w.count/maxCount)*130));
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;min-width:0">
      <span style="font-size:.75rem;font-weight:700;color:${current?'var(--brand-600)':'var(--slate-400)'}">${w.count}</span>
      <div title="${w.count} referrals, week of ${w.label}" style="width:100%;max-width:44px;height:${h}px;border-radius:8px 8px 3px 3px;background:${current?'var(--brand-500)':'var(--brand-100)'}"></div>
      <span style="font-size:.6875rem;color:var(--slate-400);white-space:nowrap">${w.label}</span>
    </div>`;
  }).join('');

  const main=document.createElement('main');
  main.className='bf-container';
  main.style.cssText='padding-top:24px;padding-bottom:48px;display:flex;flex-direction:column;gap:20px';
  main.innerHTML=`
    <div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px">
      <div>
        <h1 style="margin:0;font-size:clamp(1.375rem,3vw,1.75rem);font-weight:700;color:var(--slate-900)">${greeting}, ${esc(member.name.split(' ')[0])}</h1>
        <p style="margin:6px 0 0;font-size:.875rem;color:var(--slate-500)">Week of ${fmt(monday)} – ${fmt(sunday)}, ${now.getFullYear()} · ${esc(member.rank)}</p>
      </div>
      <button id="refer-btn" class="btn btn-brand btn-md" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"></line><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"></line></svg><span id="refer-label">Refer someone</span></button>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px">
      ${statsCard('Referrals this week',goalDone,'goal '+goalTarget+' / week',icon(['M2 21a8 8 0 0 1 13.292-6','M19 16v6','M22 19h-6','M15 8a5 5 0 1 1-10 0 5 5 0 0 1 10 0']),'brand')}
      ${statsCard('Referrals this month',stats.referralsThisMonth,'',icon(['M8 2v4','M16 2v4','M3 10h18','M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z']),'sky')}
      ${statsCard('Total team size',stats.teamSize,'+2 this month',icon(['M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2','M22 21v-2a4 4 0 0 0-3-3.87','M16 3.13a4 4 0 0 1 0 7.75','M13 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0']),'earth')}
      ${statsCard('Current rank',esc(member.rank.split(' ')[0]),'',icon(['M15.477 12.89 17 22l-5-3-5 3 1.523-9.11','M19 8A7 7 0 1 1 5 8a7 7 0 0 1 14 0']),'berry')}
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px">
      <div style="background:var(--surface);border:1px solid rgba(226,232,240,.9);border-radius:12px;box-shadow:var(--shadow-soft);padding:22px;display:flex;flex-direction:column;align-items:center;gap:14px">
        <h2 style="margin:0;align-self:flex-start;font-size:.9375rem;font-weight:700;color:var(--slate-900)">Weekly goal</h2>
        <div style="position:relative;width:150px;height:150px">
          <svg width="150" height="150" viewBox="0 0 150 150" style="transform:rotate(-90deg)">
            <circle cx="75" cy="75" r="64" fill="none" stroke="var(--brand-50)" stroke-width="13"></circle>
            <circle cx="75" cy="75" r="64" fill="none" stroke="var(--brand-500)" stroke-width="13" stroke-linecap="round" stroke-dasharray="${(pct*circ).toFixed(1)} ${circ.toFixed(1)}"></circle>
          </svg>
          <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
            <span style="font-size:1.75rem;font-weight:700;color:var(--slate-900);line-height:1">${goalDone}<span style="font-size:1rem;font-weight:500;color:var(--slate-400)"> / ${goalTarget}</span></span>
            <span style="margin-top:4px;font-size:.6875rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--slate-500)">referrals</span>
          </div>
        </div>
        <p style="margin:0;font-size:.875rem;color:var(--slate-600);text-align:center">${goalMsg}</p>
        <span style="display:inline-flex;align-items:center;gap:7px;background:var(--earth-50);color:var(--earth-700);border-radius:999px;padding:6px 14px;font-size:.8125rem;font-weight:600"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>${member.streak_weeks}-week streak</span>
      </div>

      <div style="background:var(--surface);border:1px solid rgba(226,232,240,.9);border-radius:12px;box-shadow:var(--shadow-soft);padding:22px;display:flex;flex-direction:column;gap:16px;grid-column:span 2;min-width:0">
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap">
          <h2 style="margin:0;font-size:.9375rem;font-weight:700;color:var(--slate-900)">Referrals per week</h2>
          <span style="font-size:.75rem;color:var(--slate-400)">Last 8 weeks</span>
        </div>
        <div style="display:flex;align-items:flex-end;gap:clamp(6px,2%,18px);height:180px">${bars}</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px">
      <a href="referrals.html" class="hover-lift" style="text-decoration:none;display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid rgba(226,232,240,.9);border-radius:12px;box-shadow:var(--shadow-soft);padding:18px 20px">
        <span style="display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:10px;background:var(--brand-50);color:var(--brand-600);flex-shrink:0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path></svg></span>
        <span style="flex:1;min-width:0"><span style="display:block;font-size:.9375rem;font-weight:700;color:var(--slate-900)">Your referrals</span><span style="display:block;font-size:.8125rem;color:var(--slate-500)">${referrals.length} people · track their status</span></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--slate-400)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
      </a>
      <a href="leaderboard.html" class="hover-lift" style="text-decoration:none;display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid rgba(226,232,240,.9);border-radius:12px;box-shadow:var(--shadow-soft);padding:18px 20px">
        <span style="display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:10px;background:#fdf0dc;color:var(--accent-sun);flex-shrink:0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"></path><path d="M19 8A7 7 0 1 1 5 8a7 7 0 0 1 14 0"></path></svg></span>
        <span style="flex:1;min-width:0"><span style="display:block;font-size:.9375rem;font-weight:700;color:var(--slate-900)">Team leaderboard</span><span style="display:block;font-size:.8125rem;color:var(--slate-500)">See how the team is doing this week</span></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--slate-400)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
      </a>
    </div>

    <p class="disclaimer" style="margin:0">Live data from your bf-suma database. Referral numbers reflect bookings made with your personal link — no income is guaranteed or implied.</p>`;
  root.appendChild(main);

  let copied=false;
  document.getElementById('refer-btn').addEventListener('click',()=>{
    const link='https://bfsuma.example/join?ref='+(member.referral_code||'DEMO');
    const done=()=>{ const l=document.getElementById('refer-label'); l.textContent='Link copied!'; setTimeout(()=>l.textContent='Refer someone',2000); };
    if(navigator.clipboard){ navigator.clipboard.writeText(link).then(done).catch(done); } else { done(); }
  });
}

if(isAuthed()) renderDash(); else renderLogin(false);
</script>
</body>
</html>
