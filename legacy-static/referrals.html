<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Referrals — BF Suma with Team Vitality</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/logo.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body data-active="referrals">
<div style="min-height:100vh;display:flex;flex-direction:column" id="root"></div>

<script type="module">
import { renderDashHeader, getMember, getReferrals, initials, esc } from './app.js';
const AUTH='bfsuma-demo-auth';
try{ if(localStorage.getItem(AUTH)!=='1'){ location.href='dashboard.html'; } }catch(e){}
const root=document.getElementById('root');
const badgeVariant={Booked:'info',Attended:'warning',Joined:'success'};
const tints=[{bg:'var(--brand-50)',fg:'var(--brand-700)'},{bg:'var(--sky-50)',fg:'var(--sky-700)'},{bg:'var(--earth-50)',fg:'var(--earth-700)'},{bg:'#fdecf3',fg:'var(--accent-berry)'}];
let filter='All', member=null, all=[];

const fmtDate=d=>{ const [y,m,dd]=String(d).split('-').map(Number); return new Date(y,m-1,dd).toLocaleDateString('en-UG',{month:'short',day:'numeric',year:'numeric'}); };

async function load(){
  root.innerHTML=`<div id="dash-hd"></div><main class="bf-container" style="padding:40px 0"><p style="color:var(--slate-400);font-size:.875rem">Loading referrals…</p></main>`;
  [member,all]=await Promise.all([getMember(),getReferrals()]);
  document.getElementById('dash-hd').innerHTML=renderDashHeader('referrals',initials(member.name));
  document.getElementById('logout-btn')?.addEventListener('click',()=>{ try{ localStorage.setItem(AUTH,'0'); }catch(e){} location.href='dashboard.html'; });
  render();
}

function render(){
  const statuses=['Booked','Attended','Joined'];
  const sumColors=['var(--sky-600)','var(--earth-600)','var(--brand-600)'];
  const summary=statuses.map((st,i)=>`
    <div style="background:var(--surface);border:1px solid rgba(226,232,240,.9);border-radius:12px;box-shadow:var(--shadow-soft);padding:18px 20px">
      <span style="display:block;font-size:1.75rem;font-weight:700;line-height:1;color:var(--slate-900)">${all.filter(r=>r.status===st).length}</span>
      <span style="display:block;margin-top:6px;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:${sumColors[i]}">${st}</span>
    </div>`).join('');

  const chips=['All','Booked','Attended','Joined'].map(k=>{
    const on=filter===k;
    return `<button type="button" data-f="${k}" style="padding:8px 16px;border-radius:999px;cursor:pointer;font-family:inherit;font-size:.8125rem;font-weight:600;border:1px solid ${on?'var(--brand-500)':'var(--slate-200)'};background:${on?'var(--brand-500)':'#fff'};color:${on?'#fff':'var(--slate-600)'}">${k}</button>`;
  }).join('');

  const filtered=all.filter(r=>filter==='All'||r.status===filter);
  const rows=filtered.map((r,i)=>{
    const t=tints[i%tints.length];
    return `<div style="display:flex;align-items:center;gap:12px;padding:13px 20px;border-bottom:1px solid var(--slate-100)">
      <span style="display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:999px;flex-shrink:0;background:${t.bg};color:${t.fg};font-weight:700;font-size:.75rem">${initials(r.name)}</span>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column">
        <span style="font-size:.875rem;font-weight:600;color:var(--slate-900);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}</span>
        <span style="font-size:.75rem;color:var(--slate-400)">${fmtDate(r.referral_date)}</span>
      </div>
      <span class="badge badge-${badgeVariant[r.status]||'neutral'}">${r.status}</span>
    </div>`;
  }).join('');

  const main=document.createElement('main');
  main.className='bf-container';
  main.style.cssText='padding-top:24px;padding-bottom:48px;display:flex;flex-direction:column;gap:20px';
  main.innerHTML=`
    <div>
      <h1 style="margin:0;font-size:clamp(1.375rem,3vw,1.75rem);font-weight:700;color:var(--slate-900)">Your referrals</h1>
      <p style="margin:6px 0 0;font-size:.875rem;color:var(--slate-500)">People who booked a session with your personal link.</p>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px">${summary}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${chips}</div>
    <div style="background:var(--surface);border:1px solid rgba(226,232,240,.9);border-radius:12px;box-shadow:var(--shadow-soft);overflow:hidden">
      <div style="padding:18px 20px;border-bottom:1px solid var(--slate-100);display:flex;align-items:baseline;justify-content:space-between;gap:10px">
        <h2 style="margin:0;font-size:.9375rem;font-weight:700;color:var(--slate-900)">${filter==='All'?'All referrals':filter}</h2>
        <span style="font-size:.75rem;color:var(--slate-400)">${filtered.length} shown</span>
      </div>
      <div style="display:flex;flex-direction:column">${rows||'<p style="margin:0;padding:32px 20px;text-align:center;font-size:.875rem;color:var(--slate-400)">No referrals with this status yet.</p>'}</div>
    </div>
    <p class="disclaimer" style="margin:0">Live data from your bf-suma database. No income is guaranteed or implied.</p>`;

  const old=root.querySelector('main'); if(old) old.remove();
  root.appendChild(main);
  main.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>{ filter=b.dataset.f; render(); }));
}
load();
</script>
</body>
</html>
